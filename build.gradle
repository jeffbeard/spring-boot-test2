plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0' 
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'org.firebyte'
version = '1.0.0-SNAPSHOT'

java {
	sourceCompatibility = '23'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

task run(dependsOn: build) {
	group = 'application'
	description = 'Builds and runs the application on port 8080'
	
	doLast {
		def port = 8080
		def url = "http://localhost:${port}"
		
		println "\n\nStarting application on port ${port}..."
		println "Application will be available at: ${url}\n"
		
		exec {
			commandLine './gradlew', 'bootRun', '--args=--server.port=' + port
		}
	}
}
